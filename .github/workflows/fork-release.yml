name: fork-release

# Builds and publishes the eric/local-features test builds on GitHub-hosted
# runners. A branch push is accepted only for a fast-forward two-parent merge;
# the workflow then creates its deterministic tag after validation and both
# archives succeed. Existing local-features-v* tag pushes remain a manual
# recovery path.
on:
  push:
    branches:
      - eric/local-features
    tags:
      - "local-features-v*"
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact upstream merge commit already landed on eric/local-features.
        required: true
        type: string
      upstream_tag:
        description: Stable upstream rust-v tag merged into release_sha.
        required: true
        type: string
      upstream_sha:
        description: Exact commit resolved by upstream_tag.
        required: true
        type: string
      fork_sha:
        description: Exact eric/local-features parent of the upstream merge.
        required: true
        type: string

env:
  FORK_BRANCH: eric/local-features

permissions:
  contents: read

concurrency:
  # The publisher App's tag push starts a tag event while this branch run is
  # still publishing. Keep that recovery/no-op run from cancelling the release.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare exact release identity
    # The App-created tag event is already represented by the branch-merge
    # release run. Skip only that exact App actor; human tag pushes remain the
    # documented recovery path.
    if: github.ref_type != 'tag' || github.actor != vars.RELEASE_APP_BOT_LOGIN
    runs-on: ubuntu-22.04
    outputs:
      release_sha: ${{ steps.metadata.outputs.release_sha }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      source_version: ${{ steps.metadata.outputs.source_version }}
      stable_lineage: ${{ steps.metadata.outputs.stable_lineage }}
      included_upstream_main_sha: ${{ steps.metadata.outputs.included_upstream_main_sha }}
      source_kind: ${{ steps.metadata.outputs.source_kind }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve event identity
        id: metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ inputs.release_sha || github.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          UPSTREAM_URL: https://github.com/openai/codex.git
          FORK_URL: https://github.com/${{ github.repository }}.git
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          UPSTREAM_SHA: ${{ inputs.upstream_sha }}
          FORK_SHA: ${{ inputs.fork_sha }}
        run: |
          set -euo pipefail
          .github/scripts/fork-release-metadata.sh \
            --repo-root "$GITHUB_WORKSPACE" \
            --event-name "$EVENT_NAME" \
            --event-ref "$EVENT_REF" \
            --event-sha "$EVENT_SHA" \
            --event-before "$EVENT_BEFORE" \
            --upstream-url "$UPSTREAM_URL" \
            --fork-url "$FORK_URL" \
            --upstream-tag "$UPSTREAM_TAG" \
            --upstream-sha "$UPSTREAM_SHA" \
            --fork-sha "$FORK_SHA" \
            --output "$GITHUB_OUTPUT"

      - name: Verify release publisher configuration
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          APP_BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}
          HAS_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_CLIENT_ID" ]]; then
            echo "::error::Set the RELEASE_APP_CLIENT_ID repository variable before release publishing" >&2
            exit 1
          fi
          if [[ -z "$APP_BOT_LOGIN" ]]; then
            echo "::error::Set the RELEASE_APP_BOT_LOGIN repository variable before release publishing" >&2
            exit 1
          fi
          if [[ "$HAS_APP_PRIVATE_KEY" != true ]]; then
            echo "::error::Set the RELEASE_APP_PRIVATE_KEY repository secret before release publishing" >&2
            exit 1
          fi

  validate:
    name: Validate workflow and updater
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/fork-upstream-validation.yml
    with:
      candidate_sha: ${{ needs.prepare.outputs.release_sha }}
      fork_sha: ${{ inputs.fork_sha }}
      upstream_tag: ${{ inputs.upstream_tag }}
      upstream_sha: ${{ inputs.upstream_sha }}

  build:
    name: Build - ${{ matrix.target }}
    needs: [prepare, validate]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest Ubuntu GitHub-hosted runner still offered, to keep the
          # glibc floor low.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # GitHub-hosted Apple Silicon.
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: codex-rs -> target
          key: fork-release-${{ matrix.target }}
          # Only the branch run writes. A local-features-v* tag run (manual
          # recovery) saved a 1.3-1.6 GB copy scoped to that tag, which no
          # branch run could restore and which still counted against the 10 GB
          # repo budget.
          save-if: ${{ github.ref == 'refs/heads/eric/local-features' }}
          # Packaging steps after the build can fail; keep the compiled
          # dependencies when they do.
          cache-on-failure: true

      # Downloads and verifies the Codex-built rusty_v8 archive/binding for
      # this target, matching codex-update's --local build exactly.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Test offline savings estimator
        run: python3 docs/shake-bench/scripts/test_shake_savings_estimate.py

      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      # The v8 crate's build script extracts RUSTY_V8_ARCHIVE to
      # target/<profile>/gn_out/obj/librusty_v8.a, outside its OUT_DIR.
      # Swatinem/rust-cache prunes that directory when saving, while the
      # restored fingerprint still marks the build script as fresh, so a
      # cache hit links against a library that no longer exists ("could not
      # find native static library `rusty_v8`"). Re-extract it up front; if
      # the build script does rerun it simply overwrites the same file.
      - name: Restore rusty_v8 static library for cached builds
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUSTY_V8_ARCHIVE"
          lib_dir=target/release/gn_out/obj
          mkdir -p "$lib_dir"
          gunzip -c "$RUSTY_V8_ARCHIVE" > "$lib_dir/librusty_v8.a"
          test -s "$lib_dir/librusty_v8.a"

      # The release profile keeps debug info (strip = false) so the symbols
      # can be archived before the shipped binaries are stripped. macOS needs
      # packed split debuginfo to get a .dSYM next to each binary.
      # Like upstream main, the branch keeps the workspace at 0.0.0 so version
      # snapshots stay stable; upstream stamps Cargo.toml only on its release
      # tag commit. Stamp the prepared version here so `codex --version`,
      # the updater, and the package metadata all agree.
      - name: Stamp workspace version
        shell: bash
        env:
          SOURCE_VERSION: ${{ needs.prepare.outputs.source_version }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          current=$(awk '
            /^\[workspace\.package\]$/ { in_workspace = 1; next }
            /^\[/ { in_workspace = 0 }
            in_workspace && /^version = / { print; exit }
          ' Cargo.toml | sed -n 's/^version = "\([^"]*\)".*/\1/p')
          if [[ "$current" == 0.0.0 ]]; then
            sed -i.bak "/^\[workspace\.package\]\$/,/^\[/ s/^version = \"0\.0\.0\"\$/version = \"$SOURCE_VERSION\"/" Cargo.toml
            rm -f Cargo.toml.bak
          elif [[ "$current" != "$SOURCE_VERSION" ]]; then
            echo "Cargo.toml workspace version $current does not match $SOURCE_VERSION" >&2
            exit 1
          fi
          grep -Fxq "version = \"$SOURCE_VERSION\"" Cargo.toml

      # bwrap (bundled in the Linux package) links libcap via pkg-config.
      - name: Install Linux bwrap build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

      - name: Cargo build
        shell: bash
        env:
          CODEX_FORK_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: ${{ contains(matrix.target, 'apple-darwin') && 'packed' || 'off' }}
        run: |
          set -euo pipefail
          bins=(--bin codex --bin codex-code-mode-host)
          # The package layout needs the bundled bubblewrap sandbox on Linux.
          if [[ "$RUNNER_OS" == Linux ]]; then
            bins+=(--bin bwrap)
          fi
          cargo build --release "${bins[@]}"

      - name: Verify binary version
        shell: bash
        env:
          SOURCE_VERSION: ${{ needs.prepare.outputs.source_version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          shake_version=$(sed -n 's/^[[:space:]]*pub(crate) const SHAKE_FEATURE_VERSION: &str = "\([^"]*\)";$/\1/p' tui/src/fork_update.rs)
          test -n "$shake_version"
          reported=$(target/release/codex --version)
          expected=$(printf 'codex-cli %s\nShake feature version: %s\nRelease tag: %s' \
            "$SOURCE_VERSION" "$shake_version" "$RELEASE_TAG")
          [[ "$reported" == "$expected" ]] || {
            echo "codex --version reported '$reported', expected source, Shake, and release versions" >&2
            exit 1
          }
          short_reported=$(target/release/codex -V)
          [[ "$short_reported" == "codex-cli $SOURCE_VERSION" ]] || {
            echo "codex -V reported '$short_reported', expected codex-cli $SOURCE_VERSION" >&2
            exit 1
          }

      # Archives the debug symbols as codex-symbols-<target>.tar.gz (attached
      # to the release) and strips the binaries in place, so the tarball, the
      # .deb and the Homebrew download stay small.
      - name: Archive symbols and strip binaries
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          bash "$GITHUB_WORKSPACE/.github/scripts/archive-release-symbols-and-strip-binaries.sh" \
            --target "$target" \
            --artifact-name "$target" \
            --release-dir target/release \
            --archive-dir . \
            --binaries "codex codex-code-mode-host"
          test -s "codex-symbols-$target.tar.gz"
          for binary in codex codex-code-mode-host; do
            if [[ "$RUNNER_OS" == Linux ]]; then
              if readelf -S "target/release/$binary" | grep -q '\.debug_info'; then
                echo "$binary still carries .debug_info after strip" >&2
                exit 1
              fi
            fi
            ls -l "target/release/$binary"
          done

      - name: Record glibc version (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ldd --version | awk 'NR == 1 { print $NF }' > glibc-version.txt
          test -s glibc-version.txt

      # Build the canonical Codex package layout (codex-package.json, bin/,
      # codex-path/rg, codex-resources/) that the app-server daemon needs to
      # seed its managed install, then add the Shake extras at the package
      # root. Root-level codex and codex-code-mode-host symlinks keep older
      # install.sh copies, the .deb builder, and the Homebrew formula
      # working; codex canonicalizes to bin/codex so the layout is detected.
      # The payload check makes an incomplete archive fail before it can be
      # uploaded to the publish job.
      - name: Package archive
        shell: bash
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          SOURCE_VERSION: ${{ needs.prepare.outputs.source_version }}
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          archive="codex-$target.tar.gz"
          stage="$RUNNER_TEMP/codex-package-$target"
          package_args=(
            --target "$target"
            --variant codex
            --package-version "$SOURCE_VERSION"
            --cargo-profile release
            --entrypoint-bin target/release/codex
            --code-mode-host-bin target/release/codex-code-mode-host
            --package-dir "$stage"
            --force
          )
          if [[ "$RUNNER_OS" == Linux ]]; then
            package_args+=(--bwrap-bin target/release/bwrap)
          fi
          python3 "$GITHUB_WORKSPACE/scripts/build_codex_package.py" "${package_args[@]}"
          install -m 755 docs/shake-bench/scripts/codex-shake-estimate \
            docs/shake-bench/scripts/shake-savings-estimate.py "$stage/"
          install -m 644 docs/shake-bench/scripts/pricing_lib.py \
            docs/shake-bench/pricing.json "$stage/"
          ln -s bin/codex "$stage/codex"
          ln -s bin/codex-code-mode-host "$stage/codex-code-mode-host"
          tar -C "$stage" -czf "$archive" \
            codex-package.json bin codex-path codex-resources \
            codex codex-code-mode-host codex-shake-estimate \
            shake-savings-estimate.py pricing_lib.py pricing.json

          required=(
            codex-package.json
            bin/codex
            bin/codex-code-mode-host
            codex-path/rg
            codex
            codex-code-mode-host
            codex-shake-estimate
            shake-savings-estimate.py
            pricing_lib.py
            pricing.json
          )
          if [[ "$RUNNER_OS" == Linux ]]; then
            required+=(codex-resources/bwrap)
          fi
          listing=$(tar -tzf "$archive")
          for entry in "${required[@]}"; do
            grep -Fx "$entry" <<<"$listing" >/dev/null || {
              echo "$archive is missing $entry" >&2
              exit 1
            }
          done

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-${{ matrix.target }}
          path: |
            codex-rs/codex-${{ matrix.target }}.tar.gz
            codex-rs/codex-symbols-${{ matrix.target }}.tar.gz
            codex-rs/glibc-version.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [prepare, validate, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Build .deb package
        id: deb
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SOURCE_VERSION: ${{ needs.prepare.outputs.source_version }}
        run: |
          set -euo pipefail
          out=$(bash .github/scripts/build-fork-deb.sh \
            dist/codex-x86_64-unknown-linux-gnu.tar.gz \
            "$RELEASE_TAG" "$SOURCE_VERSION" dist)
          deb_path=$(sed -n 's/^deb_path=//p' <<<"$out" | tail -n1)
          test -n "$deb_path"
          test -s "$deb_path"
          echo "deb_path=$deb_path" >> "$GITHUB_OUTPUT"
          echo "deb_name=$(basename "$deb_path")" >> "$GITHUB_OUTPUT"

      - name: Verify artifacts and compose release body
        shell: bash
        env:
          FORK_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SOURCE_VERSION: ${{ needs.prepare.outputs.source_version }}
          STABLE_LINEAGE: ${{ needs.prepare.outputs.stable_lineage }}
          INCLUDED_UPSTREAM_MAIN_SHA: ${{ needs.prepare.outputs.included_upstream_main_sha }}
          SOURCE_KIND: ${{ needs.prepare.outputs.source_kind }}
          DEB_NAME: ${{ steps.deb.outputs.deb_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$RELEASE_SHA"
          test "$(git rev-parse --verify "$RELEASE_SHA^{commit}")" = "$RELEASE_SHA"

          linux_archive="dist/codex-x86_64-unknown-linux-gnu.tar.gz"
          macos_archive="dist/codex-aarch64-apple-darwin.tar.gz"
          linux_symbols="dist/codex-symbols-x86_64-unknown-linux-gnu.tar.gz"
          macos_symbols="dist/codex-symbols-aarch64-apple-darwin.tar.gz"
          for archive in "$linux_archive" "$macos_archive" "$linux_symbols" "$macos_symbols"; do
            test -s "$archive"
            tar -tzf "$archive" >/dev/null
          done
          test -s dist/glibc-version.txt
          test -s "dist/$DEB_NAME"

          (
            cd dist
            sha256sum "$(basename "$linux_archive")" "$(basename "$macos_archive")" "$DEB_NAME" \
              "$(basename "$linux_symbols")" "$(basename "$macos_symbols")"
          ) > dist/SHA256SUMS
          (
            cd dist
            sha256sum -c SHA256SUMS
          )

          bash .github/scripts/fork-release-notes.sh \
            "$GITHUB_WORKSPACE" "$FORK_REPO" "$FORK_BRANCH" \
            "$RELEASE_SHA" "$SOURCE_VERSION" "$STABLE_LINEAGE" \
            "$INCLUDED_UPSTREAM_MAIN_SHA" "$(sed -n '1p' dist/glibc-version.txt)" \
            "$SOURCE_KIND" "$RELEASE_TAG" "$DEB_NAME" > release-body.md

      - name: Create release publisher token
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: codex
          permission-contents: write
          permission-workflows: write

      - name: Verify release publisher identity
        shell: bash
        env:
          APP_SLUG: ${{ steps.publisher-token.outputs.app-slug }}
          EXPECTED_BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}
        run: |
          set -euo pipefail
          if [[ "${APP_SLUG}[bot]" != "$EXPECTED_BOT_LOGIN" ]]; then
            echo "::error::RELEASE_APP_BOT_LOGIN must exactly match the publisher App's bot login" >&2
            exit 1
          fi

      - name: Create or update release after identity verification
        shell: bash
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          FORK_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SOURCE_VERSION: ${{ needs.prepare.outputs.source_version }}
          SOURCE_KIND: ${{ needs.prepare.outputs.source_kind }}
          DEB_NAME: ${{ steps.deb.outputs.deb_name }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::No release publisher token is available for source kind $SOURCE_KIND" >&2
            exit 1
          fi
          shake_version=$(sed -n 's/^[[:space:]]*pub(crate) const SHAKE_FEATURE_VERSION: &str = "\([^"]*\)";$/\1/p' codex-rs/tui/src/fork_update.rs)
          test -n "$shake_version"
          assets=(
            dist/codex-x86_64-unknown-linux-gnu.tar.gz
            dist/codex-aarch64-apple-darwin.tar.gz
            "dist/$DEB_NAME"
            dist/codex-symbols-x86_64-unknown-linux-gnu.tar.gz
            dist/codex-symbols-aarch64-apple-darwin.tar.gz
            dist/SHA256SUMS
          )
          release_title="Shake v${shake_version} (Codex ${SOURCE_VERSION})"
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done

          resolve_remote_tag_commit() {
            local object_type object_sha
            local ref_data
            ref_data=$(gh api \
              "repos/$FORK_REPO/git/ref/tags/$RELEASE_TAG" \
              --jq '.object.type + "\t" + .object.sha' 2>/dev/null) || return 1
            IFS=$'\t' read -r object_type object_sha <<< "$ref_data"
            if [[ "$object_type" == tag ]]; then
              gh api "repos/$FORK_REPO/git/tags/$object_sha" --jq '.object.sha'
            else
              printf '%s\n' "$object_sha"
            fi
          }

          remote_tag_sha="$(resolve_remote_tag_commit || true)"
          if [[ -n "$remote_tag_sha" && "$remote_tag_sha" != "$RELEASE_SHA" ]]; then
            echo "Tag $RELEASE_TAG resolves to $remote_tag_sha, expected $RELEASE_SHA" >&2
            exit 1
          fi

          if [[ "$SOURCE_KIND" == branch-merge && -z "$remote_tag_sha" ]]; then
            gh api --method POST "repos/$FORK_REPO/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_SHA" >/dev/null
            remote_tag_sha="$(resolve_remote_tag_commit)"
          fi
          if [[ -z "$remote_tag_sha" || "$remote_tag_sha" != "$RELEASE_SHA" ]]; then
            echo "Published tag $RELEASE_TAG is not anchored to $RELEASE_SHA" >&2
            exit 1
          fi

          release_json="$(gh release view "$RELEASE_TAG" -R "$FORK_REPO" \
            --json tagName 2>/dev/null || true)"
          if [[ -n "$release_json" ]]; then
            release_tag_name=$(jq -r '.tagName // empty' <<< "$release_json")
            if [[ "$release_tag_name" != "$RELEASE_TAG" ]]; then
              echo "Existing release has unexpected tag $release_tag_name" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" -R "$FORK_REPO" \
              "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" -R "$FORK_REPO" \
              --title "$release_title" --notes-file release-body.md --prerelease
          else
            gh release create "$RELEASE_TAG" -R "$FORK_REPO" \
              --target "$RELEASE_SHA" --prerelease \
              --title "$release_title" \
              --notes-file release-body.md "${assets[@]}"
          fi

      - name: Update Homebrew tap
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SOURCE_VERSION: ${{ needs.prepare.outputs.source_version }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping Homebrew tap update"
            exit 0
          fi

          darwin_sha=$(awk '$2 == "codex-aarch64-apple-darwin.tar.gz" { print $1 }' dist/SHA256SUMS)
          linux_sha=$(awk '$2 == "codex-x86_64-unknown-linux-gnu.tar.gz" { print $1 }' dist/SHA256SUMS)
          test -n "$darwin_sha"
          test -n "$linux_sha"

          bash .github/scripts/render-brew-formula.sh \
            "$RELEASE_TAG" "$SOURCE_VERSION" "$darwin_sha" "$linux_sha" \
            > rendered-codex-shake.rb

          tap_dir=$(mktemp -d)
          # The token is passed via the URL's userinfo only inside this git
          # command's argv, never echoed or logged; do not print the clone URL.
          git -c credential.helper= clone --quiet \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/epsalmond/homebrew-codex-shake" \
            "$tap_dir" >/dev/null 2>&1

          mkdir -p "$tap_dir/Formula"
          if [[ -f "$tap_dir/Formula/codex-shake.rb" ]] && \
            cmp -s rendered-codex-shake.rb "$tap_dir/Formula/codex-shake.rb"; then
            echo "::notice::Homebrew formula is unchanged; skipping tap commit"
            exit 0
          fi
          cp rendered-codex-shake.rb "$tap_dir/Formula/codex-shake.rb"

          git -C "$tap_dir" -c user.name="codex-fork-release" \
            -c user.email="epsalmond@gmail.com" \
            add Formula/codex-shake.rb
