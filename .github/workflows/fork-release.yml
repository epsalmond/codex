name: fork-release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        required: true
        type: string
      upstream_tag:
        required: true
        type: string
      upstream_sha:
        required: true
        type: string
      fork_sha:
        required: true
        type: string

jobs:
  require-feature-branch:
    if: github.ref == 'refs/heads/fork-automation'
    runs-on: ubuntu-22.04
    steps:
      - run: echo "Dispatch this workflow on eric/local-features." >&2; exit 1
