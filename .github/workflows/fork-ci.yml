name: fork-ci

# Lean PR gate for the epsalmond/codex fork.
#
# Upstream's PR gate (blocking-ci.yml and everything it calls: bazel, rust-ci,
# sdk, ...) needs paid macos-15-xlarge and self-hosted Windows/Linux runner
# groups, so it can never pass here. Those workflows are disabled at the repo
# level (`gh workflow disable`), not deleted, so upstream rebases/merges stay
# conflict-free. This workflow replaces them for PRs with fmt + clippy + build
# only, on standard GitHub-hosted Linux, macOS, and Windows runners. Tests are not run
# here: contributors run them locally before pushing, and the workspace test
# binaries do not fit a standard runner's disk or time budget. The build step
# stays so people running the fork's binaries know they build in CI. Windows
# also uploads a canonical dev-profile package for testing on a separate VM.
# Pushes to eric/local-features run the same job only to write the Cargo cache
# that PRs restore; the release itself is fork-release.yml.
on:
  pull_request:
  push:
    branches:
      - eric/local-features
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  # A cancelled push run never saves its cache, so only PR runs are superseded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    env:
      # Keep clippy and build in one target/<triple>/debug tree.
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      # Smaller target dir and cache on standard runners (as upstream CI).
      CARGO_INCREMENTAL: "0"
      # Far smaller than the workspace's `debug = "limited"` on disk while
      # keeping file:line in backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # clippy --tests over the whole workspace fills much of a standard
      # runner's root disk. Drop preinstalled toolchains this job never uses.
      - name: Free runner disk space
        if: runner.os == 'Linux'
        working-directory: .
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          if command -v docker >/dev/null 2>&1; then
            sudo docker image prune --all --force
          fi
          df -h /

      # DotSlash and just (for `just fmt-check`), CODEX_REPO_ROOT.
      - uses: ./.github/actions/setup-ci

      # Preserve setup-ci's Dev Drive on Windows. Unix uses the existing cache
      # location in the checkout; rust-cache follows the actual path below.
      - name: Use in-tree Cargo target dir
        if: runner.os != 'Windows'
        shell: bash
        run: echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/codex-rs/target" >> "$GITHUB_ENV"

      # libcap-dev (via pkg-config) is required by codex-bwrap's build script.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libcap-dev

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Configure Windows build environment
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - name: Disable SQLite intrinsics on Windows x64
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC" >> "$GITHUB_ENV"

      # `just fmt-check` runs ruff through uv (same pin as fork-release.yml).
      - name: Install uv
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"

      # setup-rusty-v8 resolves the V8 version with python3.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: codex-rs -> ${{ env.CARGO_TARGET_DIR }}
          key: fork-ci-${{ matrix.target }}
          # A PR's cache is readable only by that PR, yet each one is 1.4-1.7 GB
          # per target, so a few open PRs exhausted the 10 GB repo budget and
          # evicted the release caches. Only the base branch writes; PRs restore
          # it (a base-branch cache is visible to its PRs).
          save-if: ${{ github.ref == 'refs/heads/eric/local-features' }}
          # Save even when clippy/build fails, so a red push does not leave the
          # next run cold.
          cache-on-failure: true

      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      # Same fix as fork-release.yml: rust-cache prunes the extracted
      # native library while the restored fingerprint keeps v8's build script
      # fresh, so cached builds fail to link. Re-extract it up front.
      - name: Restore rusty_v8 static library for cached builds
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUSTY_V8_ARCHIVE"
          lib_dir="$CARGO_TARGET_DIR/${{ matrix.target }}/debug/gn_out/obj"
          lib_name=librusty_v8.a
          if [[ "${{ runner.os }}" == Windows ]]; then
            lib_name=rusty_v8.lib
          fi
          mkdir -p "$lib_dir"
          gunzip -c "$RUSTY_V8_ARCHIVE" > "$lib_dir/$lib_name"
          test -s "$lib_dir/$lib_name"

      # Same cheap, offline checks as fork-release.yml's validate job.
      - name: Test release helpers offline
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          bash .github/scripts/test_fork_release_metadata.sh
          bash .github/scripts/test_build_fork_deb.sh
          bash .github/scripts/test_render_brew_formula.sh
          python3 -m unittest scripts/install/test_shake_install.py

      # Same step as fork-release.yml's validate job: scripts/format.py
      # --check over just, Rust, Bazel/Starlark (buildifier via DotSlash from
      # setup-ci), and Python (ruff via uv).
      - name: Check formatting
        if: runner.os == 'Linux'
        working-directory: .
        run: just fmt-check

      - name: Test Windows directory updater
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: ./.github/scripts/test_windows_cwd_updater.ps1

      # codex-voice-host needs GStreamer >= 1.28 (apt ships 1.24) and nothing depends on it.
      # Mirrors rust-ci-full.yml's clippy step (justfile `clippy` + -D warnings).
      - name: cargo clippy
        run: cargo clippy --workspace --exclude codex-voice-host --tests -- -D warnings

      # The binaries fork-release ships, in the dev profile. Their
      # release-profile build happens in fork-release.yml on push to
      # eric/local-features.
      - name: cargo build
        shell: bash
        run: |
          set -euo pipefail
          STABLE_GIT_COMMIT="$(git rev-parse HEAD)"
          export STABLE_GIT_COMMIT
          build_args=(--bin codex --bin codex-code-mode-host)
          if [[ "${{ runner.os }}" == Windows ]]; then
            build_args+=(--bin codex-command-runner --bin codex-windows-sandbox-setup)
          fi
          cargo build --target ${{ matrix.target }} "${build_args[@]}"
          df -h /

      - name: Package Windows test build
        if: runner.os == 'Windows'
        working-directory: .
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUILD_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          archive_name="codex-${TARGET}-${source_sha}-dev.zip"
          binary_dir="$CARGO_TARGET_DIR/$TARGET/debug"
          python3 scripts/build_codex_package.py \
            --target "$TARGET" --cargo-profile dev \
            --entrypoint-bin "$binary_dir/codex.exe" \
            --code-mode-host-bin "$binary_dir/codex-code-mode-host.exe" \
            --codex-command-runner-bin "$binary_dir/codex-command-runner.exe" \
            --codex-windows-sandbox-setup-bin "$binary_dir/codex-windows-sandbox-setup.exe" \
            --package-dir "$RUNNER_TEMP/windows-package" \
            --archive-output "dist/$archive_name"
          python3 - "$archive_name" "$source_sha" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys
          import zipfile

          archive_name, source_sha = sys.argv[1:]
          archive = pathlib.Path("dist") / archive_name
          with zipfile.ZipFile(archive, "a", compression=zipfile.ZIP_DEFLATED) as package:
              for updater in ("codex-shake-update.bat", "codex-shake-update.ps1"):
                  package.write(updater, updater)
          checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive.with_suffix(".zip.sha256").write_text(
              f"{checksum}  {archive_name}\n", encoding="utf-8"
          )
          metadata = {
              "sourceSha": source_sha,
              "ref": os.environ["BUILD_REF"],
              "target": os.environ["TARGET"],
              "cargoProfile": "dev",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "archive": archive_name,
              "sha256": checksum,
          }
          pathlib.Path("dist/build-info.json").write_text(
              json.dumps(metadata, indent=2) + "\n", encoding="utf-8"
          )
          PY
          echo "WINDOWS_ARCHIVE=$archive_name" >> "$GITHUB_ENV"

      - name: Smoke test extracted Windows package
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          Expand-Archive -Path "dist/$env:WINDOWS_ARCHIVE" -DestinationPath "$env:RUNNER_TEMP/windows-package-smoke"
          python scripts/smoke_codex_package.py --package-dir "$env:RUNNER_TEMP/windows-package-smoke"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows test build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-windows-${{ matrix.target }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
