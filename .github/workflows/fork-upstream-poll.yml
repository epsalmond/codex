name: fork-upstream-poll
# Detects a new stable upstream openai/codex rust-v* tag and creates a
# workflow_dispatch on eric/local-features so a GitHub-hosted runner can
# merge and validate it. Only actual merge conflicts create the deployment
# signal consumed by the management-plane webhook forwarder. See
# epsalmond/management-plane#999.
#
# IMPORTANT (delivery path): routine updates use `workflow_dispatch` because
# pushes and deployments made with GITHUB_TOKEN do not start Actions runs.
# On an actual merge conflict, the updater creates a `deployment` event with
# a free-form payload for the existing management-plane webhook.
#
# IMPORTANT (GitHub default-branch constraint): `schedule` only runs from
# the repository's default branch. This file must exist on whatever branch
# is set as default for this to fire on its own; see the fork-automation
# branch / repo-settings note in the management-plane#999 write-up for the
# two ways to satisfy that.
#
# IMPORTANT (scheduled workflows in forks): GitHub disables `schedule`
# triggers on a fork until a human opens the Actions tab and enables
# workflows at least once, and again disables them after 60 days with no
# repository activity. If this workflow appears to have stopped firing,
# check the Actions tab first.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Fire the dispatch even if upstream is not newer (for testing).
        type: boolean
        default: false

env:
  UPSTREAM_REPO: openai/codex
  FORK_REPO: epsalmond/codex

permissions:
  actions: write
  contents: read

jobs:
  poll:
    name: Poll upstream and dispatch
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find the newest stable upstream rust-v tag
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          # Stable means no -alpha / -beta / -rc suffix, matching the tag
          # format rust-release.yml's tag-check job validates on the way in.
          tag=$(gh api --paginate "repos/${UPSTREAM_REPO}/git/matching-refs/tags/rust-v" \
              --jq '.[].ref | sub("^refs/tags/"; "")' \
            | grep -E '^rust-v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n1)
          [[ -n "$tag" ]] || { echo "no stable rust-v* tag found upstream" >&2; exit 1; }
          sha=$(gh api "repos/${UPSTREAM_REPO}/commits/${tag}" --jq '.sha')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "upstream tag did not resolve to a commit SHA" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "upstream stable tag: $tag"
          echo "upstream stable commit: $sha"

      - name: Find the fork's current published base tag
        id: current
        shell: bash
        run: |
          set -euo pipefail
          # The base tag a fork-release.yml release was cut from is recorded
          # in its body as "Based on upstream `rust-vX.Y.Z`" (see
          # .github/scripts/fork-release-notes.sh). Reading it from the
          # newest local-features-v* release avoids cloning the repo just to
          # poll every five minutes.
          release=$(gh api --paginate "repos/${FORK_REPO}/releases" \
            --jq '[.[] | select(.tag_name | startswith("local-features-v"))]
                  | sort_by(.created_at) | last')
          if [[ -z "$release" || "$release" == "null" ]]; then
            echo "no local-features-v* release found on ${FORK_REPO} yet" >&2
            echo "base=" >> "$GITHUB_OUTPUT"
          else
            base=$(jq -r '.body' <<<"$release" \
              | grep -oE 'Based on upstream `rust-v[0-9]+\.[0-9]+\.[0-9]+' \
              | head -n1 \
              | sed -E 's/.*`//')
            [[ -n "$base" ]] || { echo "could not parse base tag from release body" >&2; exit 1; }
            echo "base=$base" >> "$GITHUB_OUTPUT"
            echo "fork's current base tag: $base"
          fi

      - name: Read feature branch and check upstream ancestry
        id: fork
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          fork_sha=$(gh api "repos/${FORK_REPO}/git/ref/heads/eric/local-features" --jq '.object.sha')
          [[ "$fork_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "feature branch did not resolve to a commit SHA" >&2; exit 1; }
          comparison=$(gh api "repos/${FORK_REPO}/compare/${UPSTREAM_SHA}...${fork_sha}" --jq '.status')
          case "$comparison" in
            ahead|identical) contains_upstream=true ;;
            behind|diverged) contains_upstream=false ;;
            *) echo "unexpected compare status: $comparison" >&2; exit 1 ;;
          esac
          echo "sha=$fork_sha" >> "$GITHUB_OUTPUT"
          echo "contains_upstream=$contains_upstream" >> "$GITHUB_OUTPUT"
          echo "fork feature branch: $fork_sha; contains upstream commit: $contains_upstream"

      - name: Decide whether to dispatch
        id: decide
        shell: bash
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          CURRENT_BASE: ${{ steps.current.outputs.base }}
          FORK_CONTAINS_UPSTREAM: ${{ steps.fork.outputs.contains_upstream }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          dispatch=false
          if [[ "$FORCE" == "true" ]]; then
            echo "force=true: dispatching regardless of comparison"
            dispatch=true
          elif [[ -n "$CURRENT_BASE" && "$UPSTREAM_TAG" != "$CURRENT_BASE" ]]; then
            newest=$(printf '%s\n%s\n' "$UPSTREAM_TAG" "$CURRENT_BASE" | sort -V | tail -n1)
            if [[ "$newest" == "$UPSTREAM_TAG" ]]; then
              echo "upstream $UPSTREAM_TAG is newer than $CURRENT_BASE: dispatching"
              dispatch=true
            else
              echo "upstream $UPSTREAM_TAG is not newer than $CURRENT_BASE: nothing to do"
            fi
          elif [[ "$FORK_CONTAINS_UPSTREAM" == "true" ]]; then
            echo "feature branch already contains $UPSTREAM_SHA; no duplicate merge while release work is pending"
          else
            echo "upstream $UPSTREAM_TAG is not in the feature branch yet: dispatching"
            dispatch=true
          fi
          echo "dispatch=$dispatch" >> "$GITHUB_OUTPUT"

      - name: Dispatch GitHub-hosted upstream merge
        if: steps.decide.outputs.dispatch == 'true'
        shell: bash
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          FORK_SHA: ${{ steps.fork.outputs.sha }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh workflow run fork-upstream-update.yml \
            --repo "$FORK_REPO" \
            --ref eric/local-features \
            --field mode=upstream \
            --field "upstream_tag=$UPSTREAM_TAG" \
            --field "upstream_sha=$UPSTREAM_SHA" \
            --field "fork_sha=$FORK_SHA"
          echo "dispatched upstream merge for $UPSTREAM_TAG ($UPSTREAM_SHA) from $FORK_SHA; poll run: $run_url"
